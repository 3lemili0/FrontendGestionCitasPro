<div class="disponibilidad-container">
  <div class="form-box">

    <a routerLink="/dashboard" class="back-link">Volver</a>

    <div class="form-header">
      <h2>Gestionar mi Disponibilidad</h2>
      <p>Activa los días que trabajas, define tus horas y la duración de cada cita.</p>
    </div>

    @if (isLoading) {
      <p>Cargando tu configuración...</p>
    } @else {
      <form (ngSubmit)="guardarCambios()">
        <div class="dias-grid">
          @for (horario of horarios; track horario.diaSemana) {
            <div class="dia-card" [ngClass]="{ 'inactivo': !horario.activo }">
              
              <div class="dia-header">
                <h3>{{ getNombreDia(horario.diaSemana) }}</h3>
                <input type="checkbox" class="toggle-switch" name="activo-{{horario.diaSemana}}" [(ngModel)]="horario.activo">
              </div>
              
              <div class="form-group">
                <label>Hora Inicio</label>
                <input type="time" name="horaInicio-{{horario.diaSemana}}" [(ngModel)]="horario.horaInicio" [disabled]="!horario.activo" required>
              </div>
              <div class="form-group">
                <label>Hora Fin</label>
                <input type="time" name="horaFin-{{horario.diaSemana}}" [(ngModel)]="horario.horaFin" [disabled]="!horario.activo" required>
              </div>
              <div class="form-group">
                <label>Duración Cita (min)</label>
                <input type="number" name="duracion-{{horario.diaSemana}}" [(ngModel)]="horario.duracionCita" [disabled]="!horario.activo" required min="15">
              </div>
            </div>
          }
        </div>
        
        <div class="actions-footer">
          <button type="submit" class="submit-button" [disabled]="isSaving">
            @if (isSaving) {
              <span>Guardando...</span>
            } @else {
              <span>Guardar Cambios</span>
            }
          </button>
        </div>
      </form>
    }
  </div>
</div>
