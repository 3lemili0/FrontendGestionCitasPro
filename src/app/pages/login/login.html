<div class="auth-container">
  <div class="form-box">
    <div class="form-header">
      <h2>Iniciar Sesión</h2>
      <p>Bienvenido de nuevo. Ingresa tus credenciales.</p>
    </div>
    
    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" [(ngModel)]="credenciales.correo" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="credenciales.password" required />
      </div>
      <button type="submit" class="submit-button">Ingresar</button>
    </form>

    <div class="redirect-link">
      <p>¿No tienes una cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
    </div>
  </div>
</div>
