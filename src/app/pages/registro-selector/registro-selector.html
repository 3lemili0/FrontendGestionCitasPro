<div class="auth-container">
  <div class="form-box">
    
    <div class="form-header">
      <h2>Crear una Cuenta</h2>
      <p>Para empezar, dinos qué tipo de usuario eres.</p>
    </div>

    <div class="role-selection">
      <a routerLink="/registro/cliente" class="role-card">
        <div class="role-icon"></div>
        <div class="role-text">
          <h3>Soy un Cliente / Paciente</h3>
          <p>Quiero buscar profesionales y agendar citas.</p>
        </div>
      </a>
      <a routerLink="/registro/profesional" class="role-card">
        <div class="role-icon"></div>
        <div class="role-text">
          <h3>Soy un Profesional</h3>
          <p>Quiero ofrecer mis servicios y gestionar mi agenda.</p>
        </div>
      </a>
    </div>

    <div class="redirect-link">
      <p>¿Ya tienes una cuenta? <a routerLink="/login">Inicia Sesión</a></p>
    </div>

  </div>
</div>
