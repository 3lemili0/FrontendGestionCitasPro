<div class="auth-container">
  <div class="form-box">
    <div class="form-header">
    </div>

    <form (ngSubmit)="registrar()">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" [(ngModel)]="usuario.nombre" required />
      </div>
      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" [(ngModel)]="usuario.apellido" required />
      </div>
      <div class="form-group">
        <label for="numeroIdentificacion">Número de Identificación</label>
        <input type="text" id="numeroIdentificacion" name="numeroIdentificacion" [(ngModel)]="usuario.numeroIdentificacion" required />
      </div>
      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <input type="email" id="correo" name="correo" [(ngModel)]="usuario.correo" required />
      </div>
      <div class="form-group">
        <label for="telefono">Teléfono (Opcional)</label>
        <input type="tel" id="telefono" name="telefono" [(ngModel)]="usuario.telefono" />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="usuario.password" required />
      </div>
      <button type="submit" class="submit-button">Crear mi cuenta profesional</button>
    </form>
    
    <div class="redirect-link">
      <p>¿Ya tienes una cuenta? <a routerLink="/login">Inicia Sesión</a></p>
    </div>
  </div>
</div>
